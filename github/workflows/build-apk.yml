
name: Build Galaxy Browser APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o GalaxyBrowser-Android.zip
          cd GalaxyBrowser-Android
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Android app
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyBrowser-debug-apk
          path: GalaxyBrowser-Android/app/build/outputs/apk/debug/app-debug.apk
